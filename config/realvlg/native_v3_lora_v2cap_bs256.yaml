_base_: native_v4_drogoff_bs256.yaml

# Capacity-matched LoRA ablation for a fair comparison with Offset V2.
# Six rank-48 LoRA stages add 2,801,664 encoder parameters, within 3.2% of
# Offset V2's 2,715,696 trainable backbone/adapter parameters.
MODEL:
  native_variant: v3

TRAIN:
  native_visual_layers: [1, 3, 5, 7, 9, 11]
  native_text_layers: [1, 3, 5, 7, 9, 11]
  native_lora_rank: 48
  native_lora_alpha: 96.0
  native_lora_dropout: 0.05

  # Match Offset V2's optimizer conditions for the encoder and task heads.
  base_lr: 0.0001
  lr_multi: 1
  weight_decay: 0.0

  epochs: 24
  milestones: [20]
  batch_size: 256
  exp_name: drogoff_native_v3_lora_r48_v2cap_realvlg_full_e24_8npu_bs256
