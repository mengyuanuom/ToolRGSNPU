DATA:
  grasp_size_factor: 100
  grasp_height: 20.0
  grasp_size_coordinate: original
  dataset: OCID-VLG
  root_path: ./datasets/OCID-VLG
  with_depth: False
  train_split: train
  val_split: val
  offset_r: 20
  offset_sigma:
MODEL:
  architecture: crog
TRAIN:
  # Base Arch
  clip_pretrain: pretrain/RN50.pt
  version: multiple
  input_size: 416
  word_len: 17
  word_dim: 1024
  vis_dim: 512
  fpn_in: [512, 1024, 1024]
  fpn_out: [256, 512, 1024]

  # Keep this disabled to match the stable CROG-NPU control experiment.
  sync_bn: False
  amp: False
  optimizer: adam
  pin_memory: False
  # Decoder
  num_layers: 3
  num_head: 8
  dim_ffn: 2048
  dropout: 0.1
  intermediate: False
  # Training Setting
  workers: 4  # per process; 32 workers total with eight NPUs
  workers_val: 2
  epochs: 50
  milestones: [35]
  start_epoch: 0
  batch_size: 24  # official CROG global batch size; 3 samples per process on 8 NPUs
  batch_size_val: 24  # official global validation batch size
  base_lr: 0.0001  # official CROG base LR; do not multiply by NPU count
  lr_decay: 0.1
  lr_multi: 0.1
  weight_decay: 0.
  max_norm: 0.
  manual_seed: 0
  print_freq: 100
  # Resume & Save
  exp_name: crog_ocid_vlg_8npu
  output_folder: exp/ocid_vlg
  save_freq: 0  # disabled; only best validation checkpoints are saved
  weight:
  resume:
  evaluate: True  # evaluate on validation set, extra NPU memory needed and small batch_size_val is recommend
  # Ablation study
  use_contrastive: True
  use_pretrained_clip: True
  use_grasp_masks: True
Distributed:
  dist_url: env://
  dist_backend: 'hccl'
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: test
  evaluation_protocol: crog_legacy
  visualize: False
