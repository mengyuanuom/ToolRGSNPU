DATA:
  # RealVLG predictions are decoded back into untouched source-image
  # coordinates. Do not interpret grasp size in the 416x416 network canvas.
  grasp_size_factor: 100.0
  grasp_height: 40.0
  grasp_size_coordinate: original
  dataset: realvlg
  root_path: ./datasets/GraspNet_VLG
  with_depth: False
  train_split: train
  val_split: seen
  dataset_args:
    camera_mode: kinect
    train_fraction: 1.0
    train_seed: 0
    train_manifest:
    eval_frame: "0000"
    width_factor: 100.0

MODEL:
  # Original five-head CROG baseline, ported to the shared NPU runner.
  architecture: crog

TRAIN:
  clip_pretrain: pretrain/RN50.pt
  version: multiple
  input_size: 416
  word_len: 77
  word_dim: 1024
  vis_dim: 512
  fpn_in: [512, 1024, 1024]
  fpn_out: [256, 512, 1024]

  sync_bn: False
  amp: False
  optimizer: adam
  pin_memory: False
  num_layers: 3
  num_head: 8
  dim_ffn: 2048
  dropout: 0.1
  intermediate: False

  workers: 4
  workers_val: 2
  epochs: 36
  milestones: [30]
  start_epoch: 0
  # Global batch size; the runner divides this into 32 samples per NPU.
  batch_size: 256
  batch_size_val: 32
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 0.1
  weight_decay: 0.0
  max_norm: 1.0
  manual_seed: 0
  print_freq: 100
  exp_name: crog_realvlg_full_bs256_e36_8npu
  output_folder: exp/realvlg
  save_freq: 0
  weight:
  resume:
  evaluate: True
  use_contrastive: True
  use_pretrained_clip: True
  use_grasp_masks: True

Distributed:
  dist_url: env://
  dist_backend: hccl
  multiprocessing_distributed: True
  world_size: 1
  rank: 0

TEST:
  # CROG trains width through sigmoid(width_logits); keep decoding identical.
  grasp_size_activation: sigmoid
  test_split: seen
  val_loop: realvlg_val
  evaluation_protocol: realvlg_official
  grasp_topk: [1]
  mask_threshold: 0.35
  realvlg_width_factor: 100.0
  visualize: False
