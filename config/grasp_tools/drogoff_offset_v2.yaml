# Dense Offset V2 on the Grasp-Tools Dataset V2 release.
# The two V2 labels are independent: dataset release and offset protocol.
DATA:
  grasp_size_factor: 300.0
  grasp_height: 20.0
  grasp_size_coordinate: original
  dataset: GraspTool
  root_path: ./datasets/grasp-tools/aug_graspall_v2
  train_split: train
  val_split: val
  offset_r: 20
  offset_sigma:
  offset_version: v2
  offset_target_stride: 4
  offset_weight_floor: 0.25
  dynamic_train_prompts: True
  dynamic_prompt_seed: 2025
MODEL:
  architecture: drogoff
  offset_head: lightweight
  offset_hidden_dim: 64
TRAIN:
  version: multiple
  visual_adapter_dim: 128
  visual_adapter_layer: [1,3,5,7,9,11]
  txt_adapter_dim: 64
  txtual_adapter_layer: [1,3,5,7,9,11]
  clip_pretrain: pretrain/ViT-B-16.pt
  dino_pretrain: pretrain/dinov2_vitb14_reg4_pretrain.pth
  dino_layers: 12
  output_dinov2: [4, 8]
  dino_name: dino-base
  model_name: CLIP-b-16
  input_size: 448
  word_len: 32
  word_dim: 512
  ladder_dim: 128
  nhead: 8
  multi_stage: 3
  stride: [1, 1, 1]
  vis_dim: 512
  fpn_in: [768, 768, 768]
  fpn_out: [256, 512, 1024]
  sync_bn: False
  amp: False
  optimizer: adam
  pin_memory: False
  projector: dynamic
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.1
  intermediate: False
  workers: 4
  workers_val: 2
  epochs: 30
  milestones: [24]
  start_epoch: 0
  batch_size: 64
  batch_size_val: 32
  base_lr: 0.0008
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.0
  max_norm: 1.0
  manual_seed: 0
  print_freq: 100
  exp_name: drogoff_grasp_tools_dataset_v2_offset_v2_8npu
  offset_loss_weight: 0.1
  output_folder: exp/grasp_tools
  save_freq: 0
  weight:
  resume:
  evaluate: True
  val_start_epoch: 11
  val_freq: 1
  use_grasp_masks: True
Distributed:
  dist_url: env://
  dist_backend: hccl
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  grasp_size_activation: auto
  grasp_iou_threshold: 0.50
  grasp_iou_thresholds: [0.25, 0.50]
  grasp_angle_threshold: 30.0
  test_split: test
  offset_decode_mode: grasp_relative
  offset_resample_geometry: False
  visualize: False
