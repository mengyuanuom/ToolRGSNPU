DATA:
  grasp_size_factor: 300
  grasp_height: 20.0
  grasp_size_coordinate: original
  dataset: GraspTool
  root_path: ./datasets/grasp-tools/aug_graspall_v2
  train_split: train
  val_split: val
  offset_r: 20
  offset_sigma:
MODEL:
  architecture: grconvnetclip
TRAIN:
  clip_pretrain: pretrain/RN50.pt
  version: multiple
  input_channels: 3
  input_size: 416
  word_len: 32
  word_dim: 1024
  dropout: False
  dropout_prob: 0.0
  amp: False
  sync_bn: False
  optimizer: adam
  pin_memory: False

  workers: 4  # per process; 32 workers total with eight NPUs
  workers_val: 2
  epochs: 80
  milestones: [35]
  start_epoch: 0
  batch_size: 256  # global batch size
  batch_size_val: 256  # global validation batch size
  base_lr: 0.00004
  lr_decay: 0.1
  lr_multi: 0.1
  weight_decay: 0.0
  max_norm: 1.0
  manual_seed: 0
  print_freq: 100
  exp_name: grconvnetclip_grasp_tools_v2_8npu
  output_folder: exp/grasp_tools
  save_freq: 0  # disabled; only best validation checkpoints are saved
  weight:
  resume:
  evaluate: True
  use_pretrained_clip: True
  use_grasp_masks: True
Distributed:
  dist_url: env://
  dist_backend: hccl
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  grasp_size_activation: auto
  grasp_iou_threshold: 0.50
  grasp_iou_thresholds: [0.25, 0.50]
  grasp_angle_threshold: 30.0
  test_split: test
  visualize: False


