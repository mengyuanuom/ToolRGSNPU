TRAIN:
  grasp_loss_profile: sigmoid_masked
  quality_positive_threshold: 0.05
  geometry_mask_threshold: 0.000001
  workers: 8
  workers_val: 4
  epochs: 40
  start_epoch: 0
  batch_size: 10  # official ETRG single-device batch size
  batch_size_val: 10  # official ETRG validation batch size
  base_lr: 0.0001  # official ETRG base LR
  lr_multi: 1.0
  weight_decay: 0.01
  max_norm: 0.0
  weight:
  resume:
  evaluate: true
TEST:
  grasp_quality_activation: sigmoid
  grasp_size_activation: sigmoid
RUNTIME:
  optim_wrapper:
    type: npu_amp
  param_scheduler:
    type: multi_step
    milestones: [35]
    gamma: 0.1
