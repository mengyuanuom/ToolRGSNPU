DATA:
  dataset: realvlg
  root_path: ./datasets/GraspNet_VLG
  with_depth: False
  train_split: train
  # The runner validates on the official seen split while training.
  val_split: seen
  offset_r: 20
  offset_sigma:
  # Historical fixed-radius center-offset supervision.
  offset_version: v1
  dataset_args:
    camera_mode: kinect
    # The paper trains benchmark models with 10% of GraspNet_VLG.
    train_fraction: 0.1
    train_seed: 0
    # Optional file containing exact "scene_XXXX/FFFF.json#object_id" keys.
    train_manifest:
    eval_frame: "0000"
    width_factor: 100.0

MODEL:
  architecture: drogoff

TRAIN:
  version: multiple
  visual_adapter_dim: 128
  visual_adapter_layer: [1, 3, 5, 7, 9, 11]
  txt_adapter_dim: 64
  txtual_adapter_layer: [1, 3, 5, 7, 9, 11]
  clip_pretrain: pretrain/ViT-B-16.pt
  dino_pretrain: pretrain/dinov2_vitb14_reg4_pretrain.pth
  dino_layers: 12
  output_dinov2: [4, 8]
  dino_name: dino-base
  model_name: CLIP-b-16
  input_size: 448
  # Use CLIP's full context for RealVLG's fine-grained descriptions.
  word_len: 77
  word_dim: 512
  ladder_dim: 128
  nhead: 8
  multi_stage: 3
  stride: [1, 1, 1]
  vis_dim: 512
  fpn_in: [768, 768, 768]
  fpn_out: [256, 512, 1024]

  sync_bn: False
  amp: False
  optimizer: adam
  pin_memory: False
  projector: dynamic
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.1
  intermediate: False

  workers: 4
  workers_val: 2
  # Match the public RealVLG-R1 GraspNet-10% experiment duration.
  epochs: 10
  milestones: [7]
  start_epoch: 0
  batch_size: 128
  batch_size_val: 32
  # ToolRGS optimization setting; the official model is a different Qwen RL
  # architecture, so its 1e-6 learning rate is not transferable.
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.
  max_norm: 0.
  manual_seed: 0
  print_freq: 100
  exp_name: drogoff_realvlg_10p_8npu
  offset_loss_weight: 1.0
  output_folder: exp/realvlg
  save_freq: 0
  weight:
  resume:
  evaluate: True
  use_grasp_masks: True

Distributed:
  dist_url: env://
  dist_backend: hccl
  multiprocessing_distributed: True
  world_size: 1
  rank: 0

TEST:
  test_split: seen
  val_loop: realvlg_val
  evaluation_protocol: realvlg_official
  grasp_topk: [1]
  mask_threshold: 0.35
  realvlg_width_factor: 100.0
  offset_resample_geometry: True
  visualize: False
